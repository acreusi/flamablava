<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finalitzar compra · Flama Blava</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fbfaf7;color:#27343a}.top{height:76px;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;padding:0 7%;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:1px;color:#3f7285}.brand img{width:50px;height:50px;object-fit:cover;border-radius:50%}.back{color:#3f7285;text-decoration:none;font-weight:700}.page{max-width:1000px;margin:0 auto;padding:48px 22px 70px}.page h1{font-family:Georgia,serif;font-size:42px;margin:0 0 8px}.sub{color:#78848a;margin:0 0 30px}.checkout-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:30px}.checkout-form,.summary{background:#fff;border:1px solid #eee;border-radius:20px;padding:26px}.checkout-form label{display:block;font-weight:700;font-size:13px;margin:13px 0 7px}.checkout-form input{width:100%;padding:13px;border:1px solid #d8e0e1;border-radius:10px;font:inherit;outline:none}.checkout-form input:focus{border-color:#3f7285;box-shadow:0 0 0 3px #3f728522}.payment-options{display:flex;gap:8px;flex-wrap:wrap}.payment-option{border:1px solid #d8e0e1;background:#fff;color:#36434a;border-radius:10px;padding:11px 13px;cursor:pointer;font-weight:700}.payment-option.selected{border-color:#3f7285;background:#eef4f5;color:#315e6d}.summary{height:max-content;background:#fbfaf7}.summary h2{font-family:Georgia,serif;margin:0 0 16px}.summary-row{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #e7e4df;font-size:14px}.total{display:flex;justify-content:space-between;font-size:20px;font-weight:800;margin-top:18px}.pay{width:100%;margin-top:22px;border:0;background:#3f7285;color:#fff;padding:15px;border-radius:12px;font-weight:800;font-size:16px;cursor:pointer}.note{font-size:12px;color:#78848a;margin-top:12px;line-height:1.5}@media(max-width:700px){.checkout-grid{grid-template-columns:1fr}.page{padding-top:32px}.page h1{font-size:34px}.top{padding:0 5%}.brand span{display:none}}</style></head><body><header class="top"><a class="brand" href="index.html"><img src="assets/IMG_2383.jpeg" alt="Flama Blava"><span>FLAMA BLAVA</span></a><a class="back" href="index.html">← Tornar a la botiga</a></header><main class="page"><h1>Finalitzar compra</h1><p class="sub">Introdueix les teves dades i revisa la comanda abans de pagar.</p><div class="checkout-grid"><form class="checkout-form" id="checkoutForm"><label>Nom i cognoms</label><input required autocomplete="name" placeholder="Nom i cognoms"><label>Correu electrònic</label><input type="email" required autocomplete="email" placeholder="tu@exemple.com"><label>Telèfon</label><input type="tel" required autocomplete="tel" placeholder="600 000 000"><label>Adreça d’enviament</label><input required autocomplete="street-address" placeholder="Carrer, número, pis..."><label>Població</label><input required autocomplete="address-level2" placeholder="Població"><label>Codi postal</label><input required autocomplete="postal-code" inputmode="numeric" placeholder="08000"><label>Mètode de pagament</label><div class="payment-options"><button type="button" class="payment-option selected">💳 Targeta</button><button type="button" class="payment-option"> Apple Pay</button><button type="button" class="payment-option">G Google Pay</button></div><button class="pay" type="submit">Pagar ara · <span id="payTotal">0,00 €</span></button></form><aside class="summary"><h2>La teva comanda</h2><div id="summary"></div><div class="total"><span>Total</span><span id="total">0,00 €</span></div></aside></div></main><script>const cart=JSON.parse(localStorage.getItem('flamaBlavaCart')||'[]');const esc=v=>String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');const total=cart.reduce((s,x)=>s+x.price*x.qty,0);document.getElementById('summary').innerHTML=cart.map(x=>'<div class="summary-row"><span>'+esc(x.name)+' × '+x.qty+'</span><strong>'+((x.price*x.qty).toFixed(2).replace('.',','))+' €</strong></div>').join('');document.getElementById('total').textContent=total.toFixed(2).replace('.',',')+' €';document.getElementById('payTotal').textContent=total.toFixed(2).replace('.',',')+' €';document.querySelectorAll('.payment-option').forEach(b=>b.onclick=()=>{document.querySelectorAll('.payment-option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});document.getElementById('checkoutForm').onsubmit=e=>e.preventDefault();</script></body></html>
